# Development — builds a local image with source and runs with hot-reload
# Usage: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-voice-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: callcenter
      POSTGRES_PASSWORD: callcenter
      POSTGRES_DB: ai_voice_agent
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U callcenter -d ai_voice_agent']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-voice-agent-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-voice-agent-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://callcenter:callcenter@postgres:5432/ai_voice_agent
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
  redis_data:
